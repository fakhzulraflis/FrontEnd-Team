<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Dashboard — Admin Sagu Nusantara</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="admin.css">
    <link rel="icon" href="assets/images/logo-sagu.png">

    <script src="data.js"></script>
    <!-- cek login dulu sebelum ke dashboard page -->
    <script>SaguAuth.guard("admin-login.html");</script>
</head>

<body class="admin-base admin" data-page="dashboard">
    <div class="admin-layout">

        <aside class="sidebar" id="sidebar" aria-label="Menu admin">
            <a href="#dashboard" class="brand">
                <span class="media brand__logo"><img src="assets/images/logo-sagu.png" alt=""></span>
                <span class="sidebar__brandtext">
                    <span class="brand__name">Sagu Nusantara</span>
                    <span class="sidebar__role">Dashboard CMS</span>
                </span>
            </a>

            <nav class="sidebar__nav" aria-label="Modul konten">
                <p class="sidebar__group">Ringkasan</p>
                <a href="#dashboard" class="sidebar__link" data-view="dashboard">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
                    <span>Dashboard</span>
                </a>

                <p class="sidebar__group">Konten</p>
                <a href="#aboutCards" class="sidebar__link" data-view="aboutCards">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>
                    <span>Tentang Sagu</span>
                </a>
                <a href="#processingSteps" class="sidebar__link" data-view="processingSteps">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/><path d="M7.5 12h9" stroke-dasharray="2 2"/></svg>
                    <span>Proses Pengolahan</span>
                </a>
                <a href="#foods" class="sidebar__link" data-view="foods">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5"/></svg>
                    <span>Kuliner Sagu</span>
                </a>
                <a href="#regions" class="sidebar__link" data-view="regions">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
                    <span>Persebaran</span>
                </a>
                <a href="#facts" class="sidebar__link" data-view="facts">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
                    <span>Fakta Menarik</span>
                </a>
                <a href="#quizzes" class="sidebar__link" data-view="quizzes">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.3 2.4c-.5.2-.8.7-.8 1.2V14"/><path d="M12 17.5v.01"/></svg>
                    <span>Quiz</span>
                </a>

                <p class="sidebar__group">Situs</p>
                <a href="#settings" class="sidebar__link" data-view="settings">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
                    <span>Pengaturan Website</span>
                </a>
            </nav>

            <div class="sidebar__foot">
                <a href="index.html" target="_blank" rel="noopener" class="btn btn--outline btn--sm">Preview website</a>
                <button type="button" class="btn btn--primary btn--sm" id="logoutBtn">Keluar</button>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

        <div class="admin-main">
            <header class="topbar">
                <button type="button" class="nav-toggle" id="sidebarToggle" aria-controls="sidebar" aria-expanded="false" aria-label="Buka menu">
                    <span></span><span></span><span></span>
                </button>

                <div class="topbar__titles">
                    <p class="topbar__crumb" id="viewCrumb">Ringkasan</p>
                    <h1 class="topbar__title" id="viewTitle">Dashboard</h1>
                </div>

                <div class="topbar__actions">
                    <span class="topbar__user" id="userBadge">admin</span>
                </div>
            </header>

            <!-- isinya diisi dari admin.js -->
            <main class="admin-content" id="view" tabindex="-1"></main>
        </div>
    </div>

    <!-- popup form tambah / edit -->
    <dialog class="admin-dialog" id="formModal" aria-labelledby="formTitle">
        <form class="dialog-form" id="entityForm" novalidate>
            <div class="batik-strip" role="presentation"></div>
            <div class="dialog-head">
                <h2 id="formTitle">Tambah data</h2>
                <button type="button" class="dialog-close" data-close aria-label="Tutup form">×</button>
            </div>
            <div class="dialog-body">
                <div class="form-grid" id="formFields"></div>
            </div>
            <div class="dialog-actions">
                <button type="button" class="btn btn--outline btn--sm" data-close>Batal</button>
                <button type="submit" class="btn btn--primary btn--sm" id="formSubmit">Simpan</button>
            </div>
        </form>
    </dialog>

    <!-- popup konfirmasi hapus / import / reset -->
    <dialog class="admin-dialog admin-dialog--sm" id="confirmModal" aria-labelledby="confirmTitle">
        <form method="dialog" class="confirm">
            <h2 id="confirmTitle">Konfirmasi</h2>
            <p id="confirmMessage"></p>
            <div class="dialog-actions">
                <button value="cancel" class="btn btn--outline btn--sm" autofocus>Batal</button>
                <button value="ok" class="btn btn--danger btn--sm" id="confirmOk">Hapus</button>
            </div>
        </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <input type="file" id="importFile" accept=".json,application/json" hidden>

    <script src="admin.js"></script>
</body>
</html>
